  </defs>
  <!-- Tuerca hexagonal exterior -->
  <polygon points="16,2 29,9.5 29,22.5 16,30 3,22.5 3,9.5" fill="url(#nutGrad)" stroke="#A8C4EC" stroke-width="1.8" stroke-linejoin="round"/>
