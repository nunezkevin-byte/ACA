  <line x1="16" y1="30" x2="16" y2="22.2" stroke="#A8C4EC" stroke-width="1.2" opacity="0.6"/>
  <line x1="3" y1="22.5" x2="9.8" y2="18.6" stroke="#A8C4EC" stroke-width="1.2" opacity="0.6"/>
  <line x1="3" y1="9.5" x2="9.8" y2="13.4" stroke="#A8C4EC" stroke-width="1.2" opacity="0.6"/>
